<!DOCTYPE html>
<html>

<head>
    <title>Problema 6</title>
    <style>
        table {
            border-collapse: collapse;
        }

        table,
        td {
            border: 1px solid black;
            text-align: center;
        }

        td {
            height: 50px;
            min-width: 50px;
        }
        body{
            background: lavender;
        }
    </style>
</head>

<body onload="generateTable()">
    <table id="myTable" style="width: 180px; margin-top: 1em;"></table>
</body>

<script>
    var empty, dim = 3; // pozitia spatiului gol si dimensiunea tablei

    function generateTable() {
        var numbers;
        
        // genereaza o tabla pana cand configuratia este rezolvabila
        do {
            numbers = generateNumbers(dim * dim);
        } while (!isSolvable(numbers));

        var elem;
        var output = "";
        for (let i = 0; i < dim; i++) {
            output += '<tr>';
            for (let j = 0; j < dim; j++) {
                output += `<td id='${i * dim + j}'>`;
                elem = numbers.pop();
                if (elem != dim * dim) {
                    output += elem; // afiseaza numarul
                } else {
                    empty = i * dim + j; // salveaza pozitia spatiului gol
                }
                output += '</td>';
            }
            output += '</tr>';
        }
        document.getElementById("myTable").innerHTML = output;
    }

    // verifica daca tabla este rezolvabila (numar par de inversari)
    function isSolvable(array) {
        let inversions = 0;
        let flat = array.filter(x => x !== dim * dim); // ignora spatiul gol
        for (let i = 0; i < flat.length - 1; i++) {
            for (let j = i + 1; j < flat.length; j++) {
                if (flat[i] > flat[j]) inversions++;
            }
        }
        return inversions % 2 === 0;
    }

    // interschimba doua celule
    function swap(id1, id2) {
        let aux = document.getElementById(id1).innerHTML;
        document.getElementById(id1).innerHTML = document.getElementById(id2).innerHTML;
        document.getElementById(id2).innerHTML = aux;
        empty = id2; // actualizeaza pozitia spatiului gol
    }

    // detecteaza tastele sageti
    document.onkeydown = checkKey;

    function checkKey(e) {
        e = e || window.event;

        if (e.keyCode == '38') { // sus
            if (empty - dim >= 0)
                swap(empty, empty - dim);
            else
                alert('Miscare nepermisa in sus!');
        } else if (e.keyCode == '40') { // jos
            if (empty + dim < dim * dim)
                swap(empty, empty + dim);
            else
                alert('Miscare nepermisa in jos!');
        } else if (e.keyCode == '37') { // stanga
            if (empty % dim != 0)
                swap(empty, empty - 1);
            else
                alert('Miscare nepermisa la stanga!');
        } else if (e.keyCode == '39') { // dreapta
            if (empty % dim != dim - 1)
                swap(empty, empty + 1);
            else
                alert('Miscare nepermisa la dreapta!');
        }
    }

    // amesteca elementele din array
    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // genereaza array cu numere de la 1 la n
    function generateNumbers(n) {
        let array = [];
        for (let i = 1; i <= n; i++) {
            array.push(i);
        }
        return shuffle(array);
    }
</script>

</html>
