<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercitiu Flexbox</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      
            flex-direction: column;

    }

    .box {
      width: 150px;
      height: 150px;
      background-color: cornflowerblue;
      color: white;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="box">Salut!</div>
</body>
</html>
